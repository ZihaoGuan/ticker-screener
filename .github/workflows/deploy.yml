name: Deploy Oracle Instance

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy
        required: false
        default: main
        type: string
      compose_command:
        description: Compose command after git pull
        required: false
        default: up -d --force-recreate --no-deps web caddy
        type: string
      allow_active_remote_jobs:
        description: Allow deploy even when queued or running remote jobs exist
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    concurrency:
      group: oracle-instance-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GIT_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.git_ref || github.event.workflow_run.head_branch }}
          COMPOSE_COMMAND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.compose_command || 'up -d --force-recreate --no-deps web caddy' }}
          ALLOW_ACTIVE_REMOTE_JOBS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_active_remote_jobs || 'false' }}
          APP_DIR: ${{ secrets.ORACLE_APP_DIR }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          envs: GIT_REF,COMPOSE_COMMAND,ALLOW_ACTIVE_REMOTE_JOBS,APP_DIR
          script_stop: true
          script: |
            set -euo pipefail
            cd "${APP_DIR}"
            MIGRATE_WORKER_IMAGE=false
            for WORKER_SERVICE in worker worker_parallel worker_parallel_2 worker_parallel_3; do
              WORKER_CONTAINER_ID="$(docker ps -q --filter "label=com.docker.compose.service=${WORKER_SERVICE}" | head -1)"
              if [ -n "${WORKER_CONTAINER_ID}" ] && ! docker inspect -f '{{.Config.Image}}' "${WORKER_CONTAINER_ID}" | grep -q '^ticker-screener:'; then
                # A Phase 1 worker has a live source mount. Drain it before this
                # first immutable-image deploy can change files in that mount.
                ALLOW_ACTIVE_REMOTE_JOBS="${ALLOW_ACTIVE_REMOTE_JOBS}" sh scripts/check_active_remote_jobs.sh
                MIGRATE_WORKER_IMAGE=true
                break
              fi
            done
            BACKUP_DIR="$(mktemp -d)"
            PRESERVE_PATHS="config/smallcap_exclude_tickers.txt config/manual_exclude_tickers.txt config/manual_include_tickers.txt"
            for preserve_path in ${PRESERVE_PATHS}; do
              if [ -f "${preserve_path}" ]; then
                mkdir -p "${BACKUP_DIR}/$(dirname "${preserve_path}")"
                cp "${preserve_path}" "${BACKUP_DIR}/${preserve_path}"
              fi
            done
            RESTORE_PATHS="frontend/package-lock.json ${PRESERVE_PATHS}"
            git fetch --all --prune
            # Clear tracked server-local edits only after backing them up.  Otherwise
            # checkout refuses to switch branches before the copies can be restored.
            for restore_path in ${RESTORE_PATHS}; do
              if git ls-files --error-unmatch -- "${restore_path}" >/dev/null 2>&1; then
                git restore --source=HEAD --worktree --staged -- "${restore_path}" || true
              fi
            done
            git checkout "${GIT_REF}"
            for restore_path in ${RESTORE_PATHS}; do
              if git ls-files --error-unmatch -- "${restore_path}" >/dev/null 2>&1; then
                git restore --source=HEAD --worktree --staged -- "${restore_path}" || true
              fi
            done
            git clean -fd -- frontend/package-lock.json frontend/dist frontend/tsconfig.app.tsbuildinfo frontend/tsconfig.node.tsbuildinfo frontend/vite.config.js frontend/vite.config.d.ts
            git pull --ff-only origin "${GIT_REF}"
            for preserve_path in ${PRESERVE_PATHS}; do
              if [ -f "${BACKUP_DIR}/${preserve_path}" ]; then
                cp "${BACKUP_DIR}/${preserve_path}" "${preserve_path}"
              fi
            done
            cd "${APP_DIR}"
            VELA_PREVIEW=false
            if [ -f deploy/.env ] && grep -qx 'VITE_ENABLE_VELA_PREVIEW=true' deploy/.env; then
              VELA_PREVIEW=true
            fi
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/npm-home -e npm_config_cache=/tmp/npm-cache -e VITE_ENABLE_VELA_PREVIEW="${VELA_PREVIEW}" -v "${APP_DIR}:/app" -w /app/frontend node:20 sh -c "mkdir -p /tmp/npm-home /tmp/npm-cache && npm ci && npm run build"
            IMAGE_TAG="$(git rev-parse --short=12 HEAD)"
            docker build --build-arg CODE_VERSION="${IMAGE_TAG}" -t "ticker-screener:${IMAGE_TAG}" "${APP_DIR}"
            cd deploy
            docker-compose up -d --no-recreate db || docker-compose start db
            for _ in $(seq 1 30); do
              if docker-compose exec -T db sh -lc 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            docker-compose exec -T db sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < ../sql/postgres_app_schema.sql
            # Create durable job workers when absent, but never restart existing
            # workers as part of a web deploy. They own queued and running work.
            TICKER_SCREENER_IMAGE_TAG="${IMAGE_TAG}" docker-compose up -d --no-recreate worker worker_parallel worker_parallel_2 worker_parallel_3
            if [ "${MIGRATE_WORKER_IMAGE}" = "true" ]; then
              ../scripts/upgrade_compose_worker.sh "${IMAGE_TAG}"
            fi
            TICKER_SCREENER_IMAGE_TAG="${IMAGE_TAG}" ../scripts/deploy_compose_services.sh ${COMPOSE_COMMAND}
            mkdir -p ../artifacts/status
            nohup ../scripts/upgrade_compose_worker_when_drained.sh "${IMAGE_TAG}" \
              >> "../artifacts/status/worker-upgrade-${IMAGE_TAG}.log" 2>&1 < /dev/null &
            echo "Scheduled automatic worker release for ${IMAGE_TAG} after drain."
            docker-compose ps
