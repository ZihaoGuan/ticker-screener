name: External Screener

on:
  workflow_dispatch:
    inputs:
      job_run_id:
        required: true
        type: string
      attempt:
        required: true
        type: string
      action_id:
        required: true
        type: string
      code_version:
        required: true
        type: string
      options_json:
        required: true
        type: string

permissions:
  contents: read

jobs:
  external-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_RUN_ID: ${{ inputs.job_run_id }}
      ATTEMPT: ${{ inputs.attempt }}
      ACTION_ID: ${{ inputs.action_id }}
      CODE_VERSION: ${{ inputs.code_version }}
      OPTIONS_JSON: ${{ inputs.options_json }}
      WEBAPP_BASE_URL: ${{ secrets.TICKER_SCREENER_EXTERNAL_CALLBACK_URL }}
      EXTERNAL_JOB_TOKEN: ${{ secrets.TICKER_SCREENER_EXTERNAL_JOB_CALLBACK_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - id: resolve-code-version
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.CODE_VERSION,
            });
            core.setOutput("sha", data.sha);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-code-version.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-finviz.txt

      - name: Install screener dependencies
        run: python -m pip install -r requirements.txt -r requirements-finviz.txt "psycopg[binary]>=3.2" awscli

      - name: Acknowledge execution
        run: |
          curl --fail-with-body --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 300 \
            -H "X-External-Job-Token: ${EXTERNAL_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"github_run_id\":${GITHUB_RUN_ID},\"at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            "${WEBAPP_BASE_URL%/}/api/internal/external-jobs/${JOB_RUN_ID}/heartbeat"

      - name: Run shared screener
        id: screen
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          DB_TUNNEL_KEY: ${{ secrets.TICKER_SCREENER_DB_TUNNEL_KEY }}
          DB_TUNNEL_KNOWN_HOSTS: ${{ secrets.TICKER_SCREENER_DB_TUNNEL_KNOWN_HOSTS }}
          DB_PASSWORD: ${{ secrets.TICKER_SCREENER_GITHUB_DB_PASSWORD }}
        run: |
          set -euo pipefail
          market_data_source="$(python -c 'import json, os; options = json.loads(os.environ["OPTIONS_JSON"]); print(str(options.get("market_data_source") or "").strip().lower())')"
          if [ "$market_data_source" = "database-first" ]; then
            for required_variable in ORACLE_HOST ORACLE_USER DB_TUNNEL_KEY DB_TUNNEL_KNOWN_HOSTS DB_PASSWORD; do
              test -n "${!required_variable}" || { echo "Missing required GitHub secret: ${required_variable}" >&2; exit 1; }
            done

            tunnel_port="${ORACLE_PORT:-22}"
            tunnel_dir="$(mktemp -d)"
            tunnel_socket="${RUNNER_TEMP}/ticker-screener-db-${GITHUB_RUN_ID}.sock"
            cleanup() {
              ssh -S "$tunnel_socket" -O exit -p "$tunnel_port" "${ORACLE_USER}@${ORACLE_HOST}" >/dev/null 2>&1 || true
              rm -rf "$tunnel_dir"
              rm -f "$tunnel_socket"
            }
            trap cleanup EXIT

            printf '%s\n' "$DB_TUNNEL_KEY" > "$tunnel_dir/id_ed25519"
            printf '%s\n' "$DB_TUNNEL_KNOWN_HOSTS" > "$tunnel_dir/known_hosts"
            chmod 600 "$tunnel_dir/id_ed25519"

            ssh -M -S "$tunnel_socket" -fNT \
              -i "$tunnel_dir/id_ed25519" \
              -o BatchMode=yes \
              -o ExitOnForwardFailure=yes \
              -o IdentitiesOnly=yes \
              -o KbdInteractiveAuthentication=no \
              -o PasswordAuthentication=no \
              -o ServerAliveCountMax=3 \
              -o ServerAliveInterval=30 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$tunnel_dir/known_hosts" \
              -L 127.0.0.1:15432:127.0.0.1:5432 \
              -p "$tunnel_port" \
              "${ORACLE_USER}@${ORACLE_HOST}"

            database_password_encoded="$(python -c 'import os; from urllib.parse import quote; print(quote(os.environ["DB_PASSWORD"].strip(), safe=""))')"
            export TICKER_SCREENER_DATABASE_URL="postgresql://github_screener_ro:${database_password_encoded}@127.0.0.1:15432/ticker_screener?sslmode=disable&application_name=github_external_screener"
            python -c 'import os, psycopg; connection = psycopg.connect(os.environ["TICKER_SCREENER_DATABASE_URL"]); cursor = connection.execute("SELECT 1 FROM public.ticker_metadata LIMIT 1"); cursor.fetchone(); connection.close(); print("Read-only database tunnel ready.")'
          fi

          python scripts/run_external_screener.py \
            --action-id "$ACTION_ID" \
            --options-json "$OPTIONS_JSON" \
            --artifacts-file external-artifacts.json

      - name: Publish immutable result manifest
        if: ${{ success() }}
        id: publish
        run: |
          test -n "${R2_ACCOUNT_ID}" && test -n "${R2_BUCKET}" && test -n "${R2_PUBLIC_BASE_URL}"
          PREFIX="external-jobs/${JOB_RUN_ID}/attempt-${ATTEMPT}"
          export PREFIX
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          prefix = os.environ["PREFIX"]
          base = os.environ["R2_PUBLIC_BASE_URL"].rstrip("/")
          paths = json.loads(Path("external-artifacts.json").read_text())
          endpoint = f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com"
          files = {}
          for name in ("raw", "watchlist", "summary"):
              path = Path(paths[name])
              destination = f"s3://{os.environ['R2_BUCKET']}/{prefix}/{name}.json"
              subprocess.run(["aws", "--endpoint-url", endpoint, "s3", "cp", str(path), destination], check=True)
              files[name] = {"url": f"{base}/{prefix}/{name}.json", "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          manifest = {"job_run_id": int(os.environ["JOB_RUN_ID"]), "github_run_id": int(os.environ["GITHUB_RUN_ID"]), "action_id": os.environ["ACTION_ID"], "files": files}
          Path("manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          PY
          aws --endpoint-url "$ENDPOINT" s3 cp manifest.json "s3://${R2_BUCKET}/${PREFIX}/manifest.json"
          echo "manifest_url=${R2_PUBLIC_BASE_URL%/}/${PREFIX}/manifest.json" >> "$GITHUB_OUTPUT"

      - name: Report completion
        if: ${{ always() }}
        run: |
          FINISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ steps.screen.outcome }}" = "success" ] && [ -n "${{ steps.publish.outputs.manifest_url }}" ]; then
            PAYLOAD="{\"github_run_id\":${GITHUB_RUN_ID},\"status\":\"success\",\"manifest_url\":\"${{ steps.publish.outputs.manifest_url }}\",\"finished_at\":\"${FINISHED_AT}\"}"
          else
            PAYLOAD="{\"github_run_id\":${GITHUB_RUN_ID},\"status\":\"failed\",\"message\":\"GitHub workflow failed before result publication.\",\"finished_at\":\"${FINISHED_AT}\"}"
          fi
          curl --fail-with-body --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 300 \
            -H "X-External-Job-Token: ${EXTERNAL_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${WEBAPP_BASE_URL%/}/api/internal/external-jobs/${JOB_RUN_ID}/complete"
